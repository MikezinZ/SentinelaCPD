%% SentinelaCPD - autorização por tópico (EMQX file authorizer).
%% Lido de cima para baixo; a primeira regra que combinar decide. O que não combinar é negado.
%% Usuários (criados na subida a partir do .env, ver docker-compose.yml):
%%   plataforma  -> ingestor e API (lê os dados de todos e envia comandos de OTA)
%%   dispositivo -> ESP32. O client id é o ID da placa (ESP32_CPD_<MAC>), então cada
%%                  placa só publica e só recebe nos tópicos do próprio ID.

{allow, {username, "plataforma"}, subscribe, ["sentinela/+/telemetria", "sentinela/+/evento", "sentinela/+/ota", "esp32/telemetria"]}.
{allow, {username, "plataforma"}, publish, ["sentinela/#"]}.

{allow, {username, "dispositivo"}, publish, ["sentinela/${clientid}/telemetria", "sentinela/${clientid}/evento", "sentinela/${clientid}/ota", "esp32/telemetria"]}.
{allow, {username, "dispositivo"}, subscribe, ["sentinela/${clientid}/cmd/ota"]}.

{deny, all}.
